; PULSAR — pytest configuration (plan item 0.3).
;
; `pythonpath = api` mirrors what every legacy script does with sys.path.insert,
; so tests can `import match_engine` / `import auth` / `import onchain` directly.
[pytest]
testpaths = tests
pythonpath = api
addopts = -ra --strict-markers --strict-config
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning:api.*
markers =
    emulator: requires the Firestore emulator (FIRESTORE_EMULATOR_HOST)
    chain: requires a local anvil node
    slow: takes more than a couple of seconds
    adversarial: regression test for a specific audit finding

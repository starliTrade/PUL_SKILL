<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="pulsar-singularity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="1" />
      <stop offset="10%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="core-jet-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="25%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#7dd3fc" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.98" />
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="plasma-sheath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <filter id="opt-micro" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
    <filter id="opt-subtle" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="opt-bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <!-- Deep Obsidian Cosmic Backdrop -->
  <rect width="800" height="800" fill="#090a0f" rx="160"/>

  <!-- Relativistic Polar Jets -->
  <line
    x1="50"
    y1="50"
    x2="750"
    y2="750"
    stroke="url(#plasma-sheath)"
    stroke-width="26"
    stroke-linecap="round"
    filter="url(#opt-bloom)"
    opacity="0.4"
  />
  <line
    x1="65"
    y1="65"
    x2="735"
    y2="735"
    stroke="url(#core-jet-beam)"
    stroke-width="12"
    stroke-linecap="round"
    filter="url(#opt-subtle)"
    opacity="0.75"
  />
  <line
    x1="120"
    y1="120"
    x2="680"
    y2="680"
    stroke="url(#core-jet-beam)"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- Core Halo -->
  <ellipse
    cx="400"
    cy="400"
    rx="220"
    ry="220"
    fill="url(#pulsar-singularity)"
    filter="url(#opt-bloom)"
    opacity="0.45"
  />

  <!-- Rotational Toroidal Accretion Disc -->
  <ellipse
    cx="400"
    cy="400"
    rx="145"
    ry="48"
    fill="url(#pulsar-singularity)"
    filter="url(#opt-subtle)"
    opacity="0.5"
    transform="rotate(45 400 400)"
  />
  <ellipse
    cx="400"
    cy="400"
    rx="80"
    ry="26"
    fill="url(#pulsar-singularity)"
    filter="url(#opt-micro)"
    opacity="0.7"
    transform="rotate(45 400 400)"
  />

  <!-- Harmonious Core Center -->
  <ellipse
    cx="400"
    cy="400"
    rx="20"
    ry="7"
    fill="#e0f2fe"
    opacity="0.9"
    transform="rotate(45 400 400)"
  />
  <circle cx="400" cy="400" r="4" fill="#e0f2fe" opacity="0.95" />
</svg>

name: CI

# Plan item 0.13: CI runs the same gates as `bun run verify`, split across three
# jobs so a failure names the area that broke:
#   frontend   -> typecheck (tsc), and later vitest + playwright + axe
#   game-server-> ruff, pytest (+coverage ratchet), legacy suites, Firestore emulator
#   contracts  -> forge test, the "did tests actually run" guard, anvil chain tests
# `bun run verify` remains the local entrypoint; it also auto-starts the
# emulator and anvil, which CI starts explicitly.
on:
  push:
    branches: [main]
  pull_request:
  # The deep contract campaign is too slow for a PR (~21 min); it runs here.
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC nightly
  workflow_dispatch:

concurrency:
  # A superseded run on the same ref is cancelled: the newest commit is the one
  # that matters, and the contract job is the slowest.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun tsc --noEmit

      - name: Lint (eslint) — plan item 8.21
        # `tsc` sees types; it cannot see an unused import, a missing hook
        # dependency, or a dead assignment. That is this gate.
        run: bunx eslint . --max-warnings 0
      - name: Frontend unit tests (vitest) — plan item 0.9
        run: bun run test:unit

  game-server:
    runs-on: ubuntu-latest
    # TEMPORARY (debug): lets the evidence step below push its log to a branch.
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `tests/unit/test_remediation_todo_consistency.py` checks that every
          # commit hash cited in the audit document exists. The default depth-1
          # checkout holds exactly one commit, so all 41 citations "did not
          # exist" and the job failed on a documentation test inside a server
          # job. History is part of this job's fixture.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server deps (INCLUDING google-cloud-firestore)
        # sqlite3 is the Firestore STDLib fallback (google-cloud-firestore uses
        # it for local emulation); without it the fallback import fails and CI
        # silently exercises the memory store — the exact blind spot that let
        # the NameError/@firestore.transactional crash ship unnoticed.
        #
        # This step used to also run `apt-get install -y python3-sqlite3`, which
        # does not exist on Ubuntu noble: the step exited 100 and the WHOLE
        # game-server job (ruff, pytest, the coverage ratchet, the emulator
        # suites) never ran. sqlite3 ships with the setup-python distribution,
        # so assert it is importable rather than installing a package that is
        # not there.
        run: |
          pip install -r api/requirements-dev.txt
          python3 -c "import sqlite3; print('sqlite3', sqlite3.sqlite_version)"
      - name: Lint (ruff) — plan item 0.4
        run: python3 -m ruff check api scripts tests

      - name: Types (mypy) — plan item 8.21
        # `verify.sh` had this gate all along, but mypy.ini did not exist, so it
        # always skipped. The config is committed now, so the gate is real.
        run: python3 -m mypy
      - name: Start the Firestore emulator — plan item 0.7
        # Without this, test_firestore_integration.py SKIPS and every Firestore
        # bug ships unseen (audit C1/H3/H4 all live on this path). The runner
        # ships a JDK, so only the emulator jar is needed.
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/firestore-emulator.jar \
            https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar
          nohup java -jar /tmp/firestore-emulator.jar --host=127.0.0.1 --port=8081 > /tmp/fsemu.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8081/"; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator failed to start"; tail -40 /tmp/fsemu.log; exit 1
      # Audit HIGH-8: the coverage ratchet must measure the SAME thing here as it
      # does in `scripts/verify.sh`. CI used to run `pytest --cov=api` alone,
      # which measured 79.09% against a 79.0 floor — 0.09 points of headroom —
      # while verify.sh measured pytest PLUS the legacy suites in one session
      # (81%). A green `bun run verify` therefore did not imply a green CI, and a
      # one-line regression failed CI while verify stayed green.
      #
      # The suites below run under ONE coverage session (`coverage run` then
      # `--append`), exactly like verify.sh, and the ratchet is enforced by the
      # final `coverage report` (`.coveragerc` sets fail_under; it may only ever
      # go up). The chain-marked tests skip here (no anvil in this job) and run
      # in the contracts job.
      - name: Server tests under the coverage session — plan items 0.3, 0.12
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8081
          GCLOUD_PROJECT: demo-pulsar
        # Why the output is teed and the failures are echoed as annotations
        # (2026-10-25): a failing pytest run here produces a log of several
        # thousand lines, and the log is the ONLY place the failing test names
        # appear — GitHub shows a red X with "exit code 1" and nothing else. This
        # step now re-emits the failing ids as check annotations, which the API
        # returns as structured data, so a failure can be attributed without
        # downloading a 10 000-line blob (which is also rate-limited).
        run: |
          set -uo pipefail
          python3 -m coverage erase
          python3 -m coverage run --source=api -m pytest -q 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            matched="$(grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | head -n 6 || true)"
            if [ -n "$matched" ]; then
              printf '%s\n' "$matched" | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
            else
              # No `FAILED`/`ERROR` line means pytest never produced a summary
              # (an INTERNALERROR, an import crash, `coverage` refusing to start).
              # Then the tail IS the evidence, and emitting nothing is how the
              # first attempt at this step managed to add zero information.
              echo "::error::pytest exited $status without a FAILED/ERROR summary — last lines:"
              tail -n 8 /tmp/pytest.log | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::${line:0:900}"
              done
            fi
          fi
          exit "$status"
      - name: TEMPORARY — commit the log so it can be read (debug only)
        if: failure()
        run: |
          set +e
          git config user.email "ci@pulsar.invalid"
          git config user.name "pulsar-ci"
          mkdir -p .ci-evidence
          { echo "run ${GITHUB_RUN_ID} job game-server"; tail -n 4000 /tmp/pytest.log 2>/dev/null || echo "(no log)"; } > .ci-evidence/game-server.txt
          git checkout -B ci-evidence-${GITHUB_RUN_ID}-game-server
          git add -f .ci-evidence/game-server.txt
          git commit -m "ci evidence: game-server (${GITHUB_RUN_ID})"
          git push --force origin HEAD:ci-evidence-${GITHUB_RUN_ID}-game-server
      - name: The failing test names, in the job summary (the log is not readable)
        # 2026-10-26: annotations emitted with `::error::` from the step above do
        # NOT reach the check-run API here (verified: the only failure annotation
        # is GitHub's generic "Process completed with exit code 1"). The job
        # summary DOES — `output.summary` on the check run — so the evidence goes
        # there instead. This exists because the plain log is served from a blob
        # host that returns EOF to anything that is not a browser session, which
        # makes a red build impossible to diagnose.
        if: failure()
        run: |
          {
            echo "### pytest — failure evidence"
            echo '```'
            tail -n 60 /tmp/pytest.log 2>/dev/null || echo "(no /tmp/pytest.log written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Protocol smoke tests (SIWE, commit-reveal, settlement, oracle, store roundtrip)
        # No emulator env here: `scripts/verify.sh` runs the legacy suites in
        # MEMORY mode (only the pytest gate gets FIRESTORE_EMULATOR_HOST), and
        # the coverage measurement must match. The FALLBACK step below exercises
        # the `PULSAR_MATCH_STORE=firestore` degrade path explicitly.
        run: python3 -m coverage run --append --source=api scripts/test_game_server.py
      - name: HTTP end-to-end tests (real FastAPI request layer)
        run: python3 -m coverage run --append --source=api scripts/test_http_e2e.py
      - name: Smoke tests again with the FALLBACK path forced (PULSAR_MATCH_STORE=firestore, no credentials)
        env:
          PULSAR_MATCH_STORE: firestore
        run: python3 -m coverage run --append --source=api scripts/test_game_server.py
      - name: Deposit gate + distributed rate limiter + matchmaking probe (audit #5)
        run: python3 -m coverage run --append --source=api scripts/probe_a5.py
      - name: Assert the server suite actually ran (audit HIGH-8)
        # The contracts job has had this guard since CI-1; the game-server job
        # had none, so a suite that collected nothing would still "pass".
        run: |
          set -euo pipefail
          n="$(python3 -m pytest --collect-only -q 2>/dev/null | grep -c '::' || true)"
          echo "server tests collected: $n"
          test "$n" -ge 200
      - name: Coverage ratchet over the WHOLE server suite — plan item 0.12
        # The same measurement `bun run verify` enforces, so the two gates agree.
        run: python3 -m coverage report --skip-covered
      - name: Firestore integration suite against the REAL emulator (no longer skips)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8081
          GCLOUD_PROJECT: demo-pulsar
        run: python3 scripts/test_firestore_integration.py 2>&1 | tee /tmp/firestore-integration.log; exit "${PIPESTATUS[0]}"
      - name: TEMPORARY — commit the log so it can be read (debug only)
        if: failure()
        run: |
          set +e
          git config user.email "ci@pulsar.invalid"
          git config user.name "pulsar-ci"
          mkdir -p .ci-evidence
          { echo "run ${GITHUB_RUN_ID} game-server (final)"; tail -n 2000 /tmp/firestore-integration.log 2>/dev/null || echo "(no firestore log)"; } > .ci-evidence/game-server-final.txt
          git checkout -B ci-evidence-${GITHUB_RUN_ID}-final
          git add -f .ci-evidence/game-server-final.txt
          git commit -m "ci evidence: final (${GITHUB_RUN_ID})"
          git push --force origin HEAD:ci-evidence-${GITHUB_RUN_ID}-final

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not `nightly`: a floating toolchain makes a green run
          # unreproducible and can break the suite without a repo change.
          version: v1.8.5
      # CI-1 fix: the contract suite imports BOTH forge-std (Test.sol) and
      # OpenZeppelin (contracts/test/MockUSDT.sol -> ERC20.sol). Only forge-std
      # used to be installed, so `forge test` failed to compile and the 21
      # contract tests NEVER RAN in CI. The compile gate below hid it because
      # compile_check.js re-shims MockUSDT with its own minimal ERC20.
      # Versions are pinned for reproducibility; bump them deliberately.
      - name: Install Solidity test dependencies (forge-std + OpenZeppelin)
        run: |
          set -euo pipefail
          cd contracts
          test -d lib/forge-std || git clone --depth 1 --branch v1.9.7 \
            https://github.com/foundry-rs/forge-std.git lib/forge-std
          test -d lib/openzeppelin-contracts || git clone --depth 1 --branch v5.7.0 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          # Fail loudly if a clone silently produced nothing (the failure mode
          # that let this job look configured while never compiling).
          test -f lib/forge-std/src/Test.sol
          test -f lib/openzeppelin-contracts/contracts/token/ERC20/ERC20.sol
      - name: forge test (includes struct-layout + fee pins vs the server decoder)
        # Audit 2026-10-13: `contracts/foundry.toml` defines a `[profile.ci]` with
        # larger fuzz/invariant budgets, but this step never selected it, so CI
        # ran the DEFAULT budgets and the documented profile was dead config.
        env:
          FOUNDRY_PROFILE: ci
        run: cd contracts && forge test -vvv
      - name: Assert the contract suite actually ran (CI-1 regression guard)
        # A green `forge test` that ran zero tests is the exact failure this
        # workflow shipped with. Count the executed tests explicitly.
        run: |
          set -euo pipefail
          cd contracts
          out="$(forge test --json 2>/dev/null || true)"
          ran="$(printf '%s' "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(len(v.get("test_results",{})) for v in d.values()))')"
          echo "contract tests executed: $ran"
          # Audit 2026-10-13: the floor was 21 while the suite had ~81 tests, so a
          # 60-test regression still passed. Audit M-23 (2026-10-23): the suite is
          # now 104 tests / 9 suites, measured locally with the same profile this
          # job uses (FOUNDRY_PROFILE=ci), so the floor moves to 100. Keep it
          # within a handful of the real count, never a percentage of it.
          test "$ran" -ge 100
      # Plan item 0.8: the settlement digest / decoder / Solidity contract are a
      # three-way agreement that unit tests cannot verify. Run the real money
      # path against a local EVM.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server deps for the chain gate
        run: pip install -r api/requirements-dev.txt
      - name: Start anvil + deploy the escrow
        run: bash scripts/start_anvil.sh --bg
      - name: "Chain tests (real EVM: create -> join -> settle with an oracle signature)"
        run: python3 -m pytest -q -m chain
      - name: Contract compile gate (solc 0.8.20, paris + shanghai)
        run: bun run test:contract

  # --- The deep campaign, which ran NOWHERE -----------------------------------
  #
  # Audit 2026-10-24: `contracts/foundry.toml` has carried a `[profile.nightly]`
  # since CT14 (`fuzz.runs = 10000`, `invariant.runs = 1024 depth = 500`), and
  # no workflow, script or CI job ever selected it. The deepest configuration in
  # the repository was a number in a file. It takes ~21 minutes on 2 vCPUs
  # (measured), which is why it is not a PR gate — and why "it exists" was never
  # the same as "it runs".
  #
  # Scheduled + manual, on the same pinned toolchain and the same pinned test
  # dependencies as the `contracts` job. A red run here is a real finding: the
  # default profile only explores 256 fuzz runs and 64x100 invariant calls.
  #
  # MEASURED (2-vCPU sandbox, cold compile, 2026-10-24): 1089.6 s of campaign
  # (7 properties x 1024 runs x 500 calls = 3.58 M calls, 0 reverts) inside a
  # 1760 s end-to-end command — ~29 minutes including the compile. The timeout is
  # 90 because a nightly that dies at the limit has to be re-run by hand, while
  # extra headroom costs nothing: the job only runs once a day.
  nightly-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Solidity test dependencies (forge-std + OpenZeppelin)
        run: |
          set -euo pipefail
          cd contracts
          test -d lib/forge-std || git clone --depth 1 --branch v1.9.7 \
            https://github.com/foundry-rs/forge-std.git lib/forge-std
          test -d lib/openzeppelin-contracts || git clone --depth 1 --branch v5.7.0 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          test -f lib/forge-std/src/Test.sol
          test -f lib/openzeppelin-contracts/contracts/token/ERC20/ERC20.sol
      - name: forge test --profile nightly (fuzz 10k, invariant 1024x500)
        # ONE run, machine-readable, summarised by the next step.
        #
        # The first draft ran `forge test -vvv` here and then `forge test --json`
        # in the guard — on this profile that is the whole ~30-minute campaign
        # twice. A guard that doubles the cost of the thing it guards is how a
        # nightly job gets disabled.
        env:
          FOUNDRY_PROFILE: nightly
        run: |
          set -euo pipefail
          cd contracts
          forge test -vvv --json > /tmp/forge-nightly.json
      - name: Assert the deep campaign actually ran, with the deep budgets
        # `always()`: when `forge test` fails it exits non-zero and the log holds
        # only the JSON, so this step is what names the failing tests. It cannot
        # mask the failure — the job has already failed by then.
        if: always()
        # The same guard the `contracts` job needed (CI-1): a green forge run
        # that executed the DEFAULT budgets would look identical to this one.
        # Read the profile back, then summarise the run that just happened.
        #
        # Written with `python3 -c`/a script on purpose: a heredoc inside a YAML
        # block scalar needs its terminator unindented, and an indented one is
        # silently just input — the gate would "pass" by never running.
        run: |
          set -euo pipefail
          cd contracts
          python3 -c "import tomllib;c=tomllib.load(open('foundry.toml','rb'))['profile']['nightly'];f=c['fuzz']['runs'];i=c['invariant'];assert f==10000,'fuzz budget is %d' % f;assert i['runs']==1024 and i['depth']==500,i;print('nightly budgets: fuzz=%d invariant=%dx%d' % (f,i['runs'],i['depth']))"
          python3 - <<'PYEOF'
          import json, sys
          data = json.load(open("/tmp/forge-nightly.json"))
          ran = passed = failed = 0
          for suite, body in data.items():
              for name, result in body.get("test_results", {}).items():
                  ran += 1
                  status = result.get("status")
                  if status == "Success":
                      passed += 1
                  else:
                      failed += 1
                      print(f"FAILED {suite}::{name}: {result.get('reason')}")
          print(f"deep campaign: {ran} tests, {passed} passed, {failed} failed")
          if ran < 100:
              sys.exit(f"expected >= 100 tests in the deep campaign, ran {ran}")
          if failed:
              sys.exit(f"{failed} failed")
          PYEOF

  # --- The gates CI was NOT running -------------------------------------------
  #
  # Audit 2026-10-16: verify.sh claimed "CI runs the same gates", and it did not.
  # chaos, the runbook drill, alerting, the refund time-travel suite, the
  # live-stack ranked flow and both probes ran NOWHERE in CI — so every fix in
  # Phase A was unprotected: one could break start_anvil.sh and CI would stay
  # green. This job runs the same entry point a human runs locally, so "green in
  # CI" and "green locally" finally mean the same thing.
  verify-gates:
    runs-on: ubuntu-latest
    # TEMPORARY (debug): lets the evidence step below push its log to a branch.
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - name: Install server deps
        # 2026-10-25: this step read `requirements.txt` from the repository ROOT,
        # which does not exist — the requirements live in `api/`. It failed in
        # eight seconds on every run, and because the step is not `|| true` the
        # whole job died there: the frontend deps, Foundry, Playwright, anvil and
        # `bash scripts/verify.sh` NEVER RAN. That is the same defect this job
        # was created to fix ("CI runs the same gates a human runs"), one layer
        # up: a job that never reaches its gate still shows a red X, and a red X
        # that nobody can attribute is exactly as useless as a green one.
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r api/requirements-dev.txt
          python3 -c "import sqlite3; print('sqlite3', sqlite3.sqlite_version)"
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Install Foundry (anvil + forge)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Install Solidity test dependencies (forge-std + OpenZeppelin)
        # 2026-10-25: this job deployed the escrow without them. `forge create`
        # needs OpenZeppelin (PulsarEscrow.sol imports its ERC20/IERC20) and
        # forge-std for the test sources, and the repo deliberately does not
        # vendor `lib/` — so `scripts/start_anvil.sh` failed to compile and the
        # run stopped one step before `bash scripts/verify.sh`. Same pinned
        # versions as the contracts job; bump them together.
        run: |
          set -euo pipefail
          cd contracts
          test -d lib/forge-std || git clone --depth 1 --branch v1.9.7 \
            https://github.com/foundry-rs/forge-std.git lib/forge-std
          test -d lib/openzeppelin-contracts || git clone --depth 1 --branch v5.7.0 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          test -f lib/forge-std/src/Test.sol
          test -f lib/openzeppelin-contracts/contracts/token/ERC20/ERC20.sol
      - name: Deploy the escrow to a local anvil
        run: bash scripts/start_anvil.sh --bg
      - name: The full gate
        # verify.sh starts the emulator, the API and the frontend itself. It is
        # the same script a human runs, deliberately: a separate CI-only path is
        # how the two drifted apart in the first place.
        #
        # The output is teed so the summary — in particular verify.sh's own
        # "failed gates:" list — can be re-emitted as annotations below. Without
        # that, a red verify-gates check says only "exit code 1", and the answer
        # ("which of the 22 gates?") is in a log nobody can page through.
        run: |
          set -o pipefail
          bash scripts/verify.sh 2>&1 | tee /tmp/verify-run.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Which gate failed, in the job summary (the log is not readable)
        # verify.sh prints its own "failed gates:" list, and it is the only place
        # the answer lives. The log blob is not fetchable outside a browser
        # session, so the list goes into the job summary, which the check-run API
        # returns as `output.summary`.
        if: failure()
        run: |
          {
            echo "### verify.sh — failure evidence"
            echo '```'
            sed -n '/VERIFY SUMMARY/,$p' /tmp/verify-run.log 2>/dev/null | head -n 40 \
              || echo "(verify.sh produced no summary)"
            echo '```'
            echo "### last 40 lines"
            echo '```'
            tail -n 40 /tmp/verify-run.log 2>/dev/null || echo "(no /tmp/verify-run.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: TEMPORARY — commit the log so it can be read (debug only)
        if: failure()
        run: |
          set +e
          git config user.email "ci@pulsar.invalid"
          git config user.name "pulsar-ci"
          mkdir -p .ci-evidence
          { echo "run ${GITHUB_RUN_ID} job verify-gates"; tail -n 4000 /tmp/verify-run.log 2>/dev/null || echo "(no log)"; } > .ci-evidence/verify-gates.txt
          git checkout -B ci-evidence-${GITHUB_RUN_ID}-verify-gates
          git add -f .ci-evidence/verify-gates.txt
          git commit -m "ci evidence: verify-gates (${GITHUB_RUN_ID})"
          git push --force origin HEAD:ci-evidence-${GITHUB_RUN_ID}-verify-gates
      - name: Upload the verify log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: /tmp/pulsar-e2e.log
          if-no-files-found: ignore

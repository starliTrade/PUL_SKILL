name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun tsc --noEmit

  game-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server deps (INCLUDING google-cloud-firestore + sqlite3)
        # sqlite3 is the Firestore STDLib fallback (google-cloud-firestore uses
        # it for local emulation); without it the fallback import fails and CI
        # silently exercises the memory store — the exact blind spot that let
        # the NameError/@firestore.transactional crash ship unnoticed.
        run: |
          pip install -r api/requirements.txt
          pip install httpx
          sudo apt-get update -y && sudo apt-get install -y python3-sqlite3
      - name: Protocol smoke tests (SIWE, commit-reveal, settlement, oracle, store roundtrip)
        run: python3 scripts/test_game_server.py
      - name: HTTP end-to-end tests (real FastAPI request layer)
        run: python3 scripts/test_http_e2e.py
      - name: Smoke tests again with the FALLBACK path forced (PULSAR_MATCH_STORE=firestore, no credentials)
        env:
          PULSAR_MATCH_STORE: firestore
        run: python3 scripts/test_game_server.py
      - name: Deposit gate + distributed rate limiter + matchmaking probe (audit #5)
        run: python3 scripts/probe_a5.py
      - name: Firestore integration suite (skips without credentials, runs in any env that has them)
        run: python3 scripts/test_firestore_integration.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install forge-std (test dependency)
        run: cd contracts && (test -d lib/forge-std || git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std)
      - name: forge test (includes struct-layout + fee pins vs the server decoder)
        run: cd contracts && forge test -vvv
      - name: Contract compile gate (solc 0.8.20, paris + shanghai)
        run: bun run test:contract

<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Audit 8.1: `maximum-scale=1, user-scalable=no` blocks pinch-zoom, which
         WCAG 1.4.4 (Resize Text) forbids — a low-vision user must be able to
         magnify. The app does not need it: the game target is a tap area, not a
         double-tap-to-zoom surface. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Audit L-14: `dir` used to be set only by React (LanguageProvider), so a
         Persian or Arabic player saw the whole app laid out LTR and then flip —
         a full-document reflow after hydration. This sets lang/dir BEFORE the
         first paint, from the same storage key the provider reads. It is ~15
         lines and it has to stay that way: it runs on every load, before React.
         The static `lang="en" dir` below is the fallback for no-JS and crawlers. -->
    <script id="pulsar-lang-preboot">
      (function () {
        try {
          var supported = { en: 1, fa: 1, ar: 1, tr: 1, zh: 1 };
          var lang = null;
          try { lang = localStorage.getItem('pulsar_lang'); } catch (e) {}
          if (!lang || !supported[lang]) {
            var tags = (navigator.languages && navigator.languages.length)
              ? navigator.languages
              : [navigator.language || 'en'];
            for (var i = 0; i < tags.length; i++) {
              var code = String(tags[i] || '').toLowerCase().trim();
              if (code.indexOf('fa') === 0) { lang = 'fa'; break; }
              if (code.indexOf('ar') === 0) { lang = 'ar'; break; }
              if (code.indexOf('tr') === 0) { lang = 'tr'; break; }
              if (code.indexOf('zh') === 0) { lang = 'zh'; break; }
              if (code.indexOf('en') === 0) { lang = 'en'; break; }
            }
          }
          if (!lang) lang = 'en';
          var rtl = lang === 'fa' || lang === 'ar';
          var html = document.documentElement;
          html.lang = lang;
          html.dir = rtl ? 'rtl' : 'ltr';
          if (rtl) html.classList.add('rtl'); else html.classList.remove('rtl');
        } catch (e) {}
      })();
    </script>
    <title>PUL_SKILL</title>
    <meta name="description" content="Compete in real-time skill duels. Prove you are human. Winner takes all." />
    <meta name="theme-color" content="#050505" />
    <!-- Plan item 11.3 / G15: installable. The service worker is registered in
         src/main.tsx and deliberately never caches /api — see public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="PULSAR" />
    <!-- Audit M-20: a link to the product used to render as a bare text row —
         no image, no url, and a `summary` card instead of a large one.
         `__SITE_URL__` is replaced at build time by vite-plugin-seo.ts from
         VITE_SITE_URL, because og:image MUST be absolute for crawlers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PULSAR" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="PULSAR — Skill Battles" />
    <meta property="og:description" content="Best-of-three reaction duels with real USDT stakes, settled by a non-custodial escrow contract. Winner takes 98%." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PULSAR — reaction duels, on-chain escrow, 98% payout to the winner" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PULSAR — Skill Battles" />
    <meta name="twitter:description" content="Best-of-three reaction duels with real USDT stakes, settled by a non-custodial escrow contract. Winner takes 98%." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="PULSAR — reaction duels, on-chain escrow, 98% payout to the winner" />
    <link rel="icon" type="image/svg+xml" href="/pulsar-logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Vazirmatn:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Boot hygiene (audit #6 H6): the error-swallowing interceptor that
         previously lived here was REMOVED. It overrode console.error and
         suppressed window.error/unhandledrejection for anything mentioning
         'walletconnect' or '403' — hiding exactly the error classes real
         debugging (and Sentry) need surfaced. Only the WalletConnect
         proposal-key purge remains.

         Audit M-20 (leftover): a third-party visual-editor overlay that also
         lived here is gone. It was 690 lines of inspector code from the site
         template the project started from: a MutationObserver on the whole
         document, and a `message` listener with NO origin check that could
         rewrite any element's text — a frame that could post to this window
         could relabel a stake or a button while the handler stayed the same.
         Nothing in PULSAR used it, and no runtime here is not ours any more.
         `src/seo/no-foreign-runtime.test.ts` keeps it that way. -->
    <script>
      (function() {
        // Purge orphaned/stale WalletConnect proposal keys on load.
        // Iterate BACKWARDS: removing keys inside a forward loop skips the
        // entry after each removal (indices shift under the cursor).
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            for (var i = localStorage.length - 1; i >= 0; i--) {
              var k = localStorage.key(i);
              if (k && k.indexOf('wc@2:') === 0 && k.indexOf('proposal') !== -1) {
                localStorage.removeItem(k);
              }
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#050505] text-white overflow-x-hidden antialiased select-none">
    <div id="root"></div>
    <!-- A JS-less visitor gets an explanation instead of a blank page; the app
         is a wallet-connected SPA and cannot run without scripts. -->
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif;color:#e2e8f0">
        <h1 style="font-size:18px;margin:0 0 8px">PULSAR needs JavaScript</h1>
        <p style="margin:0;color:#94a3b8">
          This is a real-time reaction-duel app that signs transactions in your wallet, so it
          cannot run without JavaScript. Enable it and reload.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

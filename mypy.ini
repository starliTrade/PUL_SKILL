; PULSAR — mypy configuration (plan item 8.21).
;
; The project had ruff (lint) and tsc (types) but nothing type-checking the
; PYTHON. `bun run verify` had a mypy gate that could never run because this
; file did not exist, so the gate silently skipped.
;
; The settings are deliberately pragmatic for a codebase that leans on
; duck-typed Firestore clients and `Any` at the boundaries: the goal is to catch
; real mistakes (wrong argument counts, None arithmetic, unreachable branches),
; not to force annotations on every helper.
[mypy]
python_version = 3.12
; `api` AND `scripts`.
;
; Until 2026-10-24 this said `api` only, and the omission had a price: `scripts/`
; held 13 type errors, two of them real. `scripts/probe_a5.py` returned `str +
; bytes` from its fake RPC — a `TypeError` on every read, which made the
; chain-mismatch scenario pass for the wrong reason (see
; tests/unit/test_chain_binding_guard.py) — and `scripts/keeper.py` carried a dead
; `body = {}` assignment. Neither is visible to a gate that only looks at `api`.
;
; `scripts/` is operational code: the keeper moves money and the probes are the
; evidence that the guards work. A file that only runs on the operator's machine
; is exactly the file that needs a type checker.
files = api, scripts
ignore_missing_imports = True
warn_unused_ignores = False
warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True
show_error_codes = True
exclude = (?x)(^api/__pycache__)

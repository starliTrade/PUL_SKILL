# Base44 development compose — PULSAR duels.
# Frontend: Vite dev server (live reload) on port 3000, served from cloned source.
# Backend:  FastAPI/uvicorn (--reload) on port 8000, in-memory store fallback.
#
# The two run on separate origins (bearer-token auth, no cookies). The backend
# CORS defaults to "*" which is safe for credentialess bearer auth. The frontend
# is wired to the backend via VITE_GAME_SERVER_URL (public URL of the API).

services:
  api:
    image: python:3.12-slim
    working_dir: /app/api
    volumes:
      - ./:/app
    # Modules in api/ import each other as top-level packages (import auth,
    # from match_engine import ...), so the working dir must be api/ and
    # PYTHONPATH must include it for --reload subprocesses.
    environment:
      - PYTHONPATH=/app/api
      - PYTHONUNBUFFERED=1
      # ORACLE_SIGNING_SECRET is required at boot (auth.py / match_engine.py
      # refuse to start without it). Delivered by the platform secret store.
    env_file:
      - /run/base44/app.env
    command: sh -c "pip install --quiet -r requirements.txt && uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  web:
    image: node:22
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./:/app
      # Anonymous volume so the container's node_modules is not shadowed by
      # the (empty) host bind mount — npm install persists across restarts.
      - /app/node_modules
    environment:
      # Public URL of the API as seen from the browser. Compose substitutes
      # BASE44_PUBLIC_HOST_SUFFIX from the sandbox host environment.
      - VITE_GAME_SERVER_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
